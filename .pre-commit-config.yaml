# House guardrail layer for stars-file-parser (mirrors shoestring-wm/moldy).
#   Install:  pre-commit install
#   Run all:  pre-commit run --all-files
# data/ holds a reference corpus (the message-template table); formatters and
# whitespace fixers leave it byte-for-byte alone.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^data/
      - id: end-of-file-fixer
        exclude: ^data/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Rust: format, lint (deny warnings), test.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false

  # moldy: format the neutral formats (JSON/YAML/Markdown). data/ excluded.
  - repo: local
    hooks:
      - id: moldy
        name: moldy (JSON/YAML/Markdown)
        entry: moldy --in-place
        language: system
        types_or: [json, yaml, markdown]
        exclude: ^data/
        verbose: true

  # knots complexity gate (rust), from the prebuilt-wheel mirror.
  - repo: https://github.com/brandon-arrendondo/knots-pre-commit
    rev: v1.19.0
    hooks:
      - id: knots
        types_or: [rust]

  # Commit policy (see AGENTS.md): DCO sign-off required, AI trailers rejected.
  # The scripts/ guards are byte-identical with the maintainer's other repos.
  - repo: local
    hooks:
      - id: commit-message-policy
        name: DCO sign-off and no AI attribution trailers
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: agent-guard-tests
        name: agent and commit guard regression tests
        entry: python3 -W error::ResourceWarning -m unittest discover -s scripts -p test_check_*.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_|test_check_).*\.py$
