[package]
name = "stars-file-parser"
version = "0.3.0"
edition = "2021"
description = "Import utilities for Stars! binary game files (.r1 race files, and future: .m, .x, .hst)"
license = "MIT"

[lib]
name = "stars_file_parser"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
